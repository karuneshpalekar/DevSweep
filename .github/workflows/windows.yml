name: windows

on:
  push:
    branches: [windows, 'windows-m*']
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [windows]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, test, AOT publish (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Environment
        run: |
          dotnet --info
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemType, DriveType, Size, SizeRemaining
          "TEMP=$env:TEMP"

      - name: Restore
        run: dotnet restore DevSweep.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build DevSweep.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test tests/DevSweep.Core.Tests/DevSweep.Core.Tests.csproj -c Release --no-build
          --results-directory TestResults --logger "trx;LogFileName=core-tests.trx"

      - name: Accuracy tests (real NTFS fixtures)
        run: >
          dotnet test tests/DevSweep.Accuracy/DevSweep.Accuracy.csproj -c Release --no-build
          --results-directory TestResults --logger "trx;LogFileName=accuracy.trx"
          --logger "console;verbosity=detailed"

      - name: Publish CLI (Native AOT)
        run: dotnet publish src/DevSweep.Cli/DevSweep.Cli.csproj -c Release -r win-x64 -o artifacts/cli

      - name: Smoke test devsweep measure
        run: |
          $exe = Resolve-Path artifacts/cli/devsweep.exe
          "devsweep.exe: {0:N0} bytes" -f (Get-Item $exe).Length
          $root = Join-Path $env:RUNNER_TEMP 'devsweep-smoke'
          New-Item -ItemType Directory -Force "$root\walked", "$root\outside" | Out-Null
          [IO.File]::WriteAllBytes("$root\walked\data.bin", [byte[]]::new(1MB))
          cmd /c mklink /H "$root\walked\data-link.bin" "$root\walked\data.bin"
          [IO.File]::WriteAllBytes("$root\outside\big.bin", [byte[]]::new(4MB))
          cmd /c mklink /J "$root\walked\to-outside" "$root\outside"

          & $exe measure "$root\walked"
          if ($LASTEXITCODE -ne 0) { throw "devsweep measure failed ($LASTEXITCODE)" }
          $json = & $exe measure "$root\walked" --json
          $json
          $r = $json | ConvertFrom-Json
          if ($r.files -ne 1) { throw "expected 1 file, got $($r.files)" }
          if ($r.hardLinkDuplicates -ne 1) { throw "expected 1 hard-link duplicate, got $($r.hardLinkDuplicates)" }
          if ($r.reparsePointCount -ne 1 -or $r.reparsePoints[0].kind -ne 'Junction') { throw "junction not recorded" }
          if ($r.bytes -ne 1MB) { throw "expected 1 MiB on disk (junction target excluded), got $($r.bytes)" }
          if (-not $r.complete -or $r.confidence -ne 'Exact') { throw "expected a complete, exact result" }
          "v2 without streams and the M0 listing must agree:"
          $fast = & $exe measure "$root\walked" --json --no-streams | ConvertFrom-Json
          $m0 = & $exe measure "$root\walked" --json --find-first-file --no-streams | ConvertFrom-Json
          if ($r.listing -ne 'FileIdExtdDirectoryInfo') { throw "expected walker v2 listing, got $($r.listing)" }
          if ($m0.listing -ne 'FindFirstFile') { throw "expected the FindFirstFile listing, got $($m0.listing)" }
          if ($fast.bytes -ne $r.bytes -or $m0.bytes -ne $r.bytes) { throw "walker modes disagree: $($r.bytes) / $($fast.bytes) / $($m0.bytes)" }
          & $exe quarantine list
          if ($LASTEXITCODE -ne 0) { throw "devsweep quarantine list failed ($LASTEXITCODE)" }
          & $exe quarantine empty
          if ($LASTEXITCODE -ne 0) { throw "devsweep quarantine empty (dry run) failed ($LASTEXITCODE)" }
          & $exe history
          if ($LASTEXITCODE -ne 0) { throw "devsweep history failed ($LASTEXITCODE)" }
          & $exe history --json | ConvertFrom-Json | Out-Null
          & $exe measure "$root\missing"
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2 for a missing path" }
          $global:LASTEXITCODE = 0
          "Reference (fsutil hardlink list):"
          fsutil hardlink list "$root\walked\data.bin"
          $global:LASTEXITCODE = 0

      - name: Smoke test devsweep rules, inventory and scan (golden scan, administrator)
        run: |
          $exe = Resolve-Path artifacts/cli/devsweep.exe
          $golden = New-Item -ItemType Directory -Force artifacts/golden
          "== rules validate (bundled packs)"
          & $exe rules validate
          if ($LASTEXITCODE -ne 0) { throw "bundled rule packs are invalid ($LASTEXITCODE)" }
          $bad = Join-Path $env:RUNNER_TEMP 'bad-pack.yml'
          Set-Content $bad "rules:`n  - id: bad`n    title: Bad`n    category: nowhere`n    risk: rebuilds`n    detector: { kind: pathz }`n    actions: [{ kind: delete }]`n    explain: { what: x }`n"
          "== rules validate (a broken pack must fail with reasons)"
          & $exe rules validate $bad
          if ($LASTEXITCODE -ne 1) { throw "a broken pack was not rejected ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0

          "== inventory"
          & $exe inventory --json > "$golden/inventory-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep inventory failed ($LASTEXITCODE)" }
          $inventory = Get-Content -Raw "$golden/inventory-admin.json" | ConvertFrom-Json
          "{0} apps from {1} records" -f $inventory.apps.Count, $inventory.records
          foreach ($source in $inventory.sources) { "  {0,-20} {1,5} {2,8:0} ms  {3}" -f $source.source, $source.count, $source.milliseconds, ($(if ($source.problems.Count -eq 0) { 'complete' } else { 'INCOMPLETE: ' + ($source.problems -join '; ') })) }
          if ($inventory.sources.Count -ne 12) { throw "expected 12 inventory sources" }
          if (($inventory.sources | Where-Object source -eq 'UninstallMachine64').count -lt 1) { throw "no apps in HKLM Uninstall" }

          "== scan --json (overview sizes)"
          & $exe scan --json > "$golden/scan-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep scan failed ($LASTEXITCODE)" }
          $scan = Get-Content -Raw "$golden/scan-admin.json" | ConvertFrom-Json
          "{0} findings, {1:N0} bytes; {2}" -f $scan.findings.Count, $scan.report.totalBytes, $scan.report.summary
          foreach ($check in $scan.report.checks) { "  {0,-14} {1,-26} {2,6:0.00} s + {3,6:0.00} s measuring, found {4}" -f $check.outcome, $check.id, $check.seconds, $check.measureSeconds, $check.found }
          foreach ($finding in $scan.findings) { "  {0,14:N0}  {1}  [{2}, {3}, {4}]" -f $finding.size, $finding.title, $finding.confidence, $finding.measurement, $finding.paths[0] }
          if ($scan.report.checks.Count -lt 8) { throw "expected every bundled rule to run" }
          if (@($scan.report.checks | Where-Object { $_.outcome -eq 'Failed' }).Count -gt 0) { throw "a check failed" }
          if (@($scan.report.ruleErrors).Count -gt 0) { throw "rule errors in the scan" }
          if (@($scan.findings | Where-Object { $_.measurement -ne 'Overview' -and $_.measurement -ne 'Reported' }).Count -gt 0) { throw "overview scan produced exact findings" }

          "== scan --exact --explain (text)"
          & $exe scan --exact --explain --category packageCaches,windows,dotnet,leftovers
          if ($LASTEXITCODE -ne 0) { throw "devsweep scan --exact failed ($LASTEXITCODE)" }
          & $exe scan --category nowhere
          if ($LASTEXITCODE -ne 2) { throw "an unknown category was not rejected" }
          $global:LASTEXITCODE = 0

      # --- Health (M3b): runtimes, security, ports ---
      - name: Smoke test devsweep runtimes, security and ports (Health, M3b)
        run: |
          $exe = Resolve-Path artifacts/cli/devsweep.exe
          $golden = New-Item -ItemType Directory -Force artifacts/golden
          "== Health is off by default (module:health)"
          $env:DEVSWEEP_FEATURES = ''
          & $exe runtimes --offline 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "expected exit code 3 with Health off, got $LASTEXITCODE" }
          $env:DEVSWEEP_FEATURES = '+module:health'

          "== runtimes --json"
          & $exe runtimes --json > "$golden/runtimes-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep runtimes failed ($LASTEXITCODE)" }
          $r = Get-Content -Raw "$golden/runtimes-admin.json" | ConvertFrom-Json
          foreach ($t in $r.runtimes) {
            "{0,-11} {1,3} installs  default: {2,-28} issues {3,2}  fixes {4,2}  sources: {5}" -f $t.name, $t.installs.Count, (($t.installs | Where-Object isDefault | ForEach-Object { "$($_.version) ($($_.source))" }) -join ', '), $t.issues.Count, $t.steps.Count, (($t.installs | ForEach-Object source | Sort-Object -Unique) -join ', ')
          }
          if ($r.windows) { "Windows: {0}, {1}, support {2}" -f $r.windows.name, $r.windows.installs[0].version, $r.windows.installs[0].support }
          "support data offline: $($r.eolOffline); PATH folders: $($r.path.Count); projects checked: $($r.projects.Count)"
          foreach ($id in 'node', 'python', 'java', 'dotnet') { if (-not ($r.runtimes | Where-Object id -eq $id)) { throw "no $id report on the runner" } }
          if (@($r.runtimes | ForEach-Object installs | Where-Object { $_.path -like '*\Microsoft\WindowsApps*' -and $_.source -ne 'StorePython' }).Count -gt 0) { throw "a Store alias was reported as an install" }

          "== runtimes (text, cached support data)"
          & $exe runtimes --offline
          if ($LASTEXITCODE -ne 0) { throw "devsweep runtimes (text) failed ($LASTEXITCODE)" }
          $step = @($r.runtimes | ForEach-Object steps) + @($r.windows.steps) | Where-Object { $_ } | Select-Object -First 1
          "first suggested fix: $($step.id) $($step.title)"
          $script = & $exe runtimes --offline --script-step $step.id
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $script)) { throw "no script written for $($step.id)" }
          Get-Content $script
          if (-not (Select-String -Path $script -SimpleMatch "Read-Host 'Press Enter" -Quiet)) { throw "the fix script does not wait for Enter" }

          "== security --json"
          & $exe security --json > "$golden/security-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep security failed ($LASTEXITCODE)" }
          $s = Get-Content -Raw "$golden/security-admin.json" | ConvertFrom-Json
          "{0} findings; looked in {1}; cloud-only files skipped {2}; git: {3}" -f $s.findings.Count, ($s.looked -join '; '), $s.cloudFilesSkipped, $(if ($s.gitUnavailable) { $s.gitUnavailable } else { 'available' })

          "== ports --json (with a listener of our own on 0.0.0.0)"
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Any, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          & $exe ports --json > "$golden/ports-admin.json"
          $code = $LASTEXITCODE
          & $exe ports
          $listener.Stop()
          if ($code -ne 0) { throw "devsweep ports failed ($code)" }
          $p = Get-Content -Raw "$golden/ports-admin.json" | ConvertFrom-Json
          $mine = $p.ports | Where-Object { $_.port -eq $port -and $_.pid -eq $PID }
          if (-not $mine) { throw "our own listener on port $port (PID $PID) was not found" }
          "our listener: {0} {1} [{2}] {3}; firewall: {4}" -f $mine.port, $mine.label, ($mine.addresses -join ', '), $mine.exposure, $mine.firewall.summary
          if ($mine.exposure -ne 'AllInterfaces') { throw "expected AllInterfaces, got $($mine.exposure)" }
          "{0} ports listed, {1} of other users hidden" -f $p.ports.Count, $p.othersHidden
      # --- end Health (M3b) ---

      # --- Projects (M3c): git safety, idle cleanup, removal, GitHub ---
      - name: Projects (M3c) live read-only GitHub smoke test
        env:
          DEVSWEEP_LIVE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet test tests/DevSweep.Core.Tests/DevSweep.Core.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~GitHubLiveSmokeTests" --logger "console;verbosity=detailed"

      - name: Smoke test devsweep projects (Projects, M3c)
        run: |
          $exe = Resolve-Path artifacts/cli/devsweep.exe
          $golden = New-Item -ItemType Directory -Force artifacts/golden
          "git: $((Get-Command git).Source) $(git --version); gh: $((Get-Command gh -ErrorAction SilentlyContinue).Source)"
          "== Projects is off by default (module:projects)"
          $env:DEVSWEEP_FEATURES = ''
          & $exe projects --offline 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "expected exit code 3 with Projects off, got $LASTEXITCODE" }
          $env:DEVSWEEP_FEATURES = '+module:projects'

          $root = Join-Path $env:RUNNER_TEMP 'devsweep-projects'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $code = New-Item -ItemType Directory -Force "$root\Code"
          $env:GIT_AUTHOR_NAME = 'CI'; $env:GIT_AUTHOR_EMAIL = 'ci@example.com'; $env:GIT_COMMITTER_NAME = 'CI'; $env:GIT_COMMITTER_EMAIL = 'ci@example.com'
          $env:GIT_AUTHOR_DATE = '2026-01-05T10:00:00Z'; $env:GIT_COMMITTER_DATE = '2026-01-05T10:00:00Z'
          git init -q --bare -b main "$root\remote-old.git"
          foreach ($name in 'old-pushed', 'old-dirty') {
            git init -q -b main "$code\$name"
            git -C "$code\$name" remote add origin "$root\remote-old.git"
            [IO.File]::WriteAllBytes("$code\$name\data.bin", [byte[]]::new(3MB))
            git -C "$code\$name" add -A
            git -C "$code\$name" commit -q -m first
          }
          git -C "$code\old-pushed" push -q -u origin main
          Set-Content "$code\old-dirty\notes.txt" 'only here'
          foreach ($name in 'old-pushed', 'old-dirty') { foreach ($f in 'HEAD', 'index') { (Get-Item "$code\$name\.git\$f").LastWriteTimeUtc = [datetime]'2026-01-05' } }
          Remove-Item Env:GIT_AUTHOR_DATE, Env:GIT_COMMITTER_DATE

          "== projects --offline --json"
          & $exe projects --root $code --offline --json > "$golden/projects-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep projects failed ($LASTEXITCODE)" }
          $list = Get-Content -Raw "$golden/projects-admin.json" | ConvertFrom-Json
          foreach ($p in $list.projects) { "  {0,-12} {1,-40} {2,12:N0} bytes  {3}" -f $p.name, $p.statusText, $p.localSize, $p.safety.state }
          if ($list.projects.Count -ne 2) { throw "expected 2 projects, got $($list.projects.Count)" }
          if (($list.projects | Where-Object name -eq 'old-pushed').safety.state -ne 'Safe') { throw "the pushed project is not safe" }
          if (($list.projects | Where-Object name -eq 'old-dirty').safety.state -ne 'NotSafe') { throw "the project with unpushed work is not flagged" }

          "== projects check"
          & $exe projects check "$code\old-pushed"
          if ($LASTEXITCODE -ne 0) { throw "check of the pushed project: expected 0, got $LASTEXITCODE" }
          & $exe projects check "$code\old-dirty"
          if ($LASTEXITCODE -ne 1) { throw "check of the dirty project: expected 1, got $LASTEXITCODE" }

          "== projects cleanup (exact sizes)"
          & $exe projects cleanup --root $code --days 7 --json > "$golden/projects-cleanup-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "devsweep projects cleanup failed ($LASTEXITCODE)" }
          $idle = Get-Content -Raw "$golden/projects-cleanup-admin.json" | ConvertFrom-Json
          foreach ($p in $idle.projects) { "  {0,-12} {1,12:N0} bytes exact={2} safe={3} {4}" -f $p.project.name, $p.freeableBytes, $p.exact, $p.isSafe, ($p.reasons -join '; ') }
          if ($idle.projects.Count -ne 2) { throw "expected both old projects in the idle list" }
          $safe = @($idle.projects | Where-Object isSafe)
          if ($safe.Count -ne 1 -or $safe[0].project.name -ne 'old-pushed') { throw "expected only old-pushed to be safe" }
          if (-not $safe[0].exact -or $safe[0].freeableBytes -lt 3MB) { throw "expected an exact size of at least 3 MiB, got $($safe[0].freeableBytes)" }
          & $exe projects cleanup --root $code --days 7 | Out-Host

          "== projects remove"
          & $exe projects remove "$code\old-dirty" --yes
          if ($LASTEXITCODE -ne 1 -or -not (Test-Path "$code\old-dirty\notes.txt")) { throw "a project with unpushed work was removed" }
          & $exe projects remove "$code\old-pushed" --yes --json > "$golden/projects-remove-admin.json"
          if ($LASTEXITCODE -ne 0) { throw "removing the safe project failed ($LASTEXITCODE): $(Get-Content -Raw "$golden/projects-remove-admin.json")" }
          $removed = Get-Content -Raw "$golden/projects-remove-admin.json" | ConvertFrom-Json
          "removed: {0}; freed {1:N0}; went to {2}; History {3}" -f $removed.message, $removed.freed, ($removed.wentTo -join ', '), $removed.historyId
          if (Test-Path "$code\old-pushed") { throw "the folder is still there" }
          $history = & $exe history --json | ConvertFrom-Json
          if (-not ($history | Where-Object { $_.id -eq $removed.historyId })) { throw "the removal is not in History" }

          "== projects activity / accounts / download --dry-run"
          & $exe projects activity
          if ($LASTEXITCODE -ne 0) { throw "devsweep projects activity failed" }
          & $exe projects accounts
          if ($LASTEXITCODE -ne 0) { throw "devsweep projects accounts failed" }
          & $exe projects download octocat/Hello-World --to "$root\dl\hello" --strategy shallow --dry-run
          if ($LASTEXITCODE -ne 0) { throw "devsweep projects download --dry-run failed" }
          $env:DEVSWEEP_FEATURES = '+module:projects -module:projects.cleanup'
          & $exe projects cleanup --root $code 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "expected exit code 3 with the cleanup tab off" }
          $global:LASTEXITCODE = 0
          Remove-Item Env:DEVSWEEP_FEATURES
      # --- end Projects (M3c) ---

      # --- M3a (Windows rule packs): golden scan with every pack, and the scan-time budget ---
      - name: M3a packs golden scan and scan-time budget (administrator)
        run: |
          $exe = Resolve-Path artifacts/cli/devsweep.exe
          $golden = New-Item -ItemType Directory -Force artifacts/golden
          $budget = 120
          $runs = @()
          foreach ($mode in 'overview', 'exact') {
            $scanArgs = @('scan', '--json'); if ($mode -eq 'exact') { $scanArgs += '--exact' }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            & $exe @scanArgs > "$golden/scan-admin-packs-$mode.json"
            $clock.Stop()
            if ($LASTEXITCODE -ne 0) { throw "devsweep scan ($mode) failed ($LASTEXITCODE)" }
            $scan = Get-Content -Raw "$golden/scan-admin-packs-$mode.json" | ConvertFrom-Json
            $runs += [pscustomobject]@{ Mode = $mode; WallSeconds = $clock.Elapsed.TotalSeconds; ReportSeconds = $scan.report.totalSeconds; Checks = $scan.report.checks.Count; Findings = $scan.findings.Count; Bytes = $scan.report.totalBytes }
            "== {5}: {0} checks, {1} findings, {2:N0} bytes, {3:0.00} s wall, {4:0.00} s in the report" -f $scan.report.checks.Count, $scan.findings.Count, $scan.report.totalBytes, $clock.Elapsed.TotalSeconds, $scan.report.totalSeconds, $mode
            "  slowest checks:"
            foreach ($check in ($scan.report.checks | Sort-Object { $_.seconds + $_.measureSeconds } -Descending | Select-Object -First 12)) { "    {0,-30} {1,6:0.00} s + {2,6:0.00} s measuring  {3,-13} found {4}" -f $check.id, $check.seconds, $check.measureSeconds, $check.outcome, $check.found }
            "  findings by category:"
            $scan.findings | Group-Object category | ForEach-Object { "    {0,-18} {1,3}  {2,16:N0} bytes" -f $_.Name, $_.Count, ($_.Group | Measure-Object size -Sum).Sum }
            foreach ($finding in $scan.findings) { "    {0,16:N0}  {1,-12} {2}  [{3}, {4}]" -f $finding.size, $finding.risk, $finding.title, $finding.measurement, $finding.ruleId }
            $bad = @($scan.report.checks | Where-Object { $_.outcome -in 'Failed', 'TimedOut' })
            if ($bad.Count -gt 0) { throw "checks failed or timed out: $(($bad | ForEach-Object { $_.id + ' ' + $_.outcome + ' ' + $_.error }) -join '; ')" }
            if (@($scan.report.ruleErrors).Count -gt 0) { throw "rule errors in the scan" }
            if ($scan.report.checks.Count -lt 80) { throw "expected every pack rule to run, got $($scan.report.checks.Count) checks" }
            if ($clock.Elapsed.TotalSeconds -gt $budget) { throw "the $mode scan took $($clock.Elapsed.TotalSeconds) s, over the $budget s budget" }
          }
          $runs | Format-Table -AutoSize | Out-String
          "== leftover checks, verified independently"
          foreach ($finding in @($scan.findings | Where-Object { $_.ruleId -in 'orphaned-scheduled-tasks', 'orphaned-startup-entries' })) {
            "  {0}: {1}" -f $finding.title, ($finding.checks.text -join ' | ')
            foreach ($program in ($finding.facts.program -split ' and ')) { if (Test-Path -LiteralPath $program) { throw "$($finding.title): $program exists, so it is not orphaned" } }
          }
          foreach ($check in @($scan.report.checks | Where-Object { $_.notes.Count -gt 0 })) { "  notes {0}: {1}" -f $check.id, ($check.notes -join ' | ') }
          $runs | ConvertTo-Json | Set-Content "$golden/scan-budget-admin.json"

          "== the packs module turned off (DEVSWEEP_FEATURES=-module:packs)"
          $env:DEVSWEEP_FEATURES = '-module:packs'
          $off = & $exe scan --json | ConvertFrom-Json
          Remove-Item Env:DEVSWEEP_FEATURES
          "{0} checks, disabled: {1}" -f $off.report.checks.Count, ($off.report.disabled -join ', ')
          if ($off.report.checks.Count -ne 8) { throw "with module:packs off, expected the 8 Clean up rules, got $($off.report.checks.Count)" }

      - name: Accuracy tests and devsweep as a standard (non-admin) user
        run: >
          ./eng/run-as-standard-user.ps1
          -TestDirectory tests/DevSweep.Accuracy/bin/Release
          -ResultsDirectory TestResults/standard-user
          -CliPath artifacts/cli/devsweep.exe

      # --- M3a: the standard user's scan must also run every pack and stay within the budget ---
      - name: M3a scan-time budget (standard user)
        run: |
          $scan = Get-Content -Raw TestResults/standard-user/scan-standard-user.json | ConvertFrom-Json
          "standard user: {0} checks, {1} findings, {2:N0} bytes, {3:0.00} s" -f $scan.report.checks.Count, $scan.findings.Count, $scan.report.totalBytes, $scan.report.totalSeconds
          foreach ($check in ($scan.report.checks | Sort-Object { $_.seconds + $_.measureSeconds } -Descending | Select-Object -First 8)) { "  {0,-30} {1,6:0.00} s + {2,6:0.00} s  {3}" -f $check.id, $check.seconds, $check.measureSeconds, $check.outcome }
          foreach ($finding in $scan.findings) { "    {0,16:N0}  {1,-12} {2}  [{3}]" -f $finding.size, $finding.risk, $finding.title, $finding.ruleId }
          foreach ($check in @($scan.report.checks | Where-Object { $_.notes.Count -gt 0 })) { "  notes {0}: {1}" -f $check.id, ($check.notes -join ' | ') }
          $bad = @($scan.report.checks | Where-Object { $_.outcome -in 'Failed', 'TimedOut' })
          if ($bad.Count -gt 0) { throw "checks failed or timed out as the standard user: $(($bad | ForEach-Object { $_.id + ' ' + $_.error }) -join '; ')" }
          if ($scan.report.checks.Count -lt 80) { throw "expected every pack rule to run as the standard user" }
          if ($scan.report.totalSeconds -gt 120) { throw "the standard user's scan took $($scan.report.totalSeconds) s, over the 120 s budget" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: windows/TestResults
          if-no-files-found: warn

      - name: Upload golden scan
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: golden-scan-windows-latest
          path: |
            windows/artifacts/golden
            windows/TestResults/standard-user/*.json
          if-no-files-found: warn

      - name: Upload CLI
        uses: actions/upload-artifact@v5
        with:
          name: devsweep-cli-win-x64
          path: windows/artifacts/cli/devsweep.exe

  # ---- M4: the WinUI 3 app (self-contained block) ----
  app:
    name: WinUI app (build, AOT publish, smoke, screenshots)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: App - build (Release, warnings as errors)
        run: dotnet build src/DevSweep.App/DevSweep.App.csproj -c Release -warnaserror

      - name: App - view model tests
        run: >
          dotnet test tests/DevSweep.App.Tests/DevSweep.App.Tests.csproj -c Release
          --results-directory TestResults --logger "trx;LogFileName=app-tests.trx" --logger "console;verbosity=normal"

      - name: App - publish self-contained x64 (Native AOT)
        run: |
          dotnet publish src/DevSweep.App/DevSweep.App.csproj -c Release -r win-x64 -o artifacts/app -warnaserror
          $exe = Get-Item artifacts/app/DevSweep.exe
          "DevSweep.exe: {0:N0} bytes" -f $exe.Length
          $all = Get-ChildItem artifacts/app -Recurse -File
          "{0} files, {1:N0} bytes in the folder" -f $all.Count, ($all | Measure-Object Length -Sum).Sum
          if (Test-Path artifacts/app/DevSweep.dll) { throw "expected a Native AOT exe, found a managed DevSweep.dll" }
          Get-ChildItem artifacts/app -Filter *.pri | ForEach-Object { "  {0} {1:N0} bytes" -f $_.Name, $_.Length }
          if (-not (Test-Path artifacts/app/resources.pri) -and -not (Test-Path artifacts/app/DevSweep.pri)) { throw "no resources.pri in the published folder" }
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/DevSweep-win-x64.zip -Force
          "zip: {0:N0} bytes" -f (Get-Item artifacts/DevSweep-win-x64.zip).Length

      - name: App - smoke test (--smoke)
        run: |
          $exe = Resolve-Path artifacts/app/DevSweep.exe
          $out = Join-Path $env:RUNNER_TEMP 'app-smoke-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'app-smoke-err.txt'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { Stop-Process -Id $p.Id -Force; Get-Content $out -ErrorAction SilentlyContinue; throw "DevSweep --smoke did not exit within 120 s" }
          $p.WaitForExit()
          "exit code $($p.ExitCode) after {0:0.0} s" -f $watch.Elapsed.TotalSeconds
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:TEMP 'devsweep-app-smoke.txt') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "DevSweep --smoke failed ($($p.ExitCode))" }
          if (-not (Select-String -Path (Join-Path $env:TEMP 'devsweep-app-smoke.txt') -Pattern 'smoke: ok' -Quiet)) { throw "smoke log has no 'smoke: ok'" }

      - name: App - smoke test with Health and Projects on
        env:
          DEVSWEEP_FEATURES: '+module:health +module:projects'
        run: |
          Remove-Item (Join-Path $env:TEMP 'devsweep-app-smoke.txt') -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path artifacts/app/DevSweep.exe) -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "did not exit within 120 s" }
          $p.WaitForExit()
          Get-Content (Join-Path $env:TEMP 'devsweep-app-smoke.txt')
          if ($p.ExitCode -ne 0) { throw "DevSweep --smoke with Health and Projects failed ($($p.ExitCode))" }
          if (-not (Select-String -Path (Join-Path $env:TEMP 'devsweep-app-smoke.txt') -Pattern 'places \(home, cleanup, projects, health, history, settings\)' -Quiet)) { throw "Projects and Health places were not rendered" }

      # ---- M5: tray, toast and login checks on the smoke log ----
      - name: App - tray icon, toast payload and login entry (smoke log)
        run: |
          $log = Join-Path $env:TEMP 'devsweep-app-smoke.txt'
          Get-Content $log | Select-String -Pattern '^\S+ (tray|toast|login):' | ForEach-Object { $_.Line }
          foreach ($needle in 'tray: ok \(created and disposed\)', 'toast: payload built', 'login: open at login is Off') {
            if (-not (Select-String -Path $log -Pattern $needle -Quiet)) { throw "smoke log has no '$needle'" }
          }
      # ---- end M5 ----

      - name: App - screenshots (light, dark, high contrast)
        env:
          DEVSWEEP_SHOTS_HIGH_CONTRAST: '1'
        run: |
          $shots = New-Item -ItemType Directory -Force artifacts/screenshots
          $env:DEVSWEEP_SHOTS = $shots.FullName
          $p = Start-Process -FilePath (Resolve-Path artifacts/app/DevSweep.exe) -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Get-Content "$shots/shots.log" -ErrorAction SilentlyContinue; throw "screenshot mode did not finish within 300 s" }
          $p.WaitForExit()
          Get-Content "$shots/shots.log" -ErrorAction SilentlyContinue
          $png = @(Get-ChildItem $shots -Filter *.png)
          "{0} screenshots" -f $png.Count
          $png | ForEach-Object { "  {0,-34} {1,10:N0} bytes" -f $_.Name, $_.Length }
          if ($p.ExitCode -ne 0) { throw "screenshot mode failed ($($p.ExitCode))" }
          if ($png.Count -lt 30) { throw "expected at least 30 screenshots" }
          $small = @($png | Where-Object Length -lt 10000)
          if ($small.Count -gt 0) { throw "suspiciously small screenshots (blank?): $($small.Name -join ', ')" }

      # ---- M5: the new Settings pages and the sidebar update card are in the tour ----
      - name: App - Settings pages in the screenshot tour
        run: |
          $png = @(Get-ChildItem artifacts/screenshots -Filter 'settings-*.png')
          "{0} Settings screenshots" -f $png.Count
          if ($png.Count -lt 10) { throw "expected the five Settings pages in light and dark" }
          $log = Get-Content artifacts/screenshots/shots.log
          $log | Select-String -Pattern 'tray menu:' | ForEach-Object { $_.Line }
          if (-not ($log | Select-String -Pattern 'tray menu: Open DevSweep' -Quiet)) { throw "the tray menu was not listed in the tour log" }
      # ---- end M5 ----

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: devsweep-app-win-x64
          path: windows/artifacts/DevSweep-win-x64.zip
          if-no-files-found: warn

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-screenshots
          path: windows/artifacts/screenshots
          if-no-files-found: warn

      - name: Upload app test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-test-results
          path: windows/TestResults
          if-no-files-found: warn
  # ---- end M4 ----
