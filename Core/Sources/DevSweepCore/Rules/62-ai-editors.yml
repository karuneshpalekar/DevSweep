# AI code editors built on VS Code, and the Claude desktop app. They keep
# the same Chromium and VS Code caches, which rebuild on their own.
rules:
  - id: cursor-caches
    title: Cursor caches
    category: ideVersions
    risk: rebuilds
    minSizeMB: 50
    blockers: ["Cursor"]
    detector:
      kind: paths
      requireApps: ["Cursor.app"]
      paths: ["~/Library/Application Support/Cursor/Cache", "~/Library/Application Support/Cursor/Code Cache", "~/Library/Application Support/Cursor/CachedData", "~/Library/Application Support/Cursor/CachedExtensionVSIXs", "~/Library/Application Support/Cursor/GPUCache"]
    actions:
      - kind: delete
    explain:
      what: "Cursor's web cache, compiled code and downloaded extension installers."
      why: "{{size}} of caches."
      ifDeleted: "Cursor starts a little slower once and rebuilds them."
      wontLose: "Settings, extensions, chats, workspaces or unsaved files."
      before: "Quit Cursor."

