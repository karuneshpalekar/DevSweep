  - id: claude-desktop-caches
    title: Claude app caches
    category: ideVersions
    risk: rebuilds
    minSizeMB: 50
    blockers: ["claude"]
    detector:
      kind: paths
      requireApps: ["Claude"]
      requireAppExes: ["claude.exe"]
      requireAppPackageIds: ["Anthropic.Claude", "claude"]
      paths: ['{RoamingAppData}\Claude\Cache', '{RoamingAppData}\Claude\Code Cache', '{RoamingAppData}\Claude\GPUCache', '{RoamingAppData}\Claude\DawnGraphiteCache', '{RoamingAppData}\Claude\GraphiteDawnCache', '{RoamingAppData}\Claude\DawnWebGPUCache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\Cache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\Code Cache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\GPUCache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\DawnGraphiteCache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\GraphiteDawnCache', '{LocalAppData}\Packages\*Claude*\LocalCache\Roaming\Claude\DawnWebGPUCache']
    actions:
      - kind: delete
    explain:
      what: "The Claude desktop app's web cache and compiled code, the same kind of cache a browser keeps."
      why: "{{size}} of caches."
      ifDeleted: "Claude opens a little slower once and rebuilds them."
      wontLose: "Conversations, projects, settings or connectors. Those are on your Anthropic account or in other folders. The virtual machine Claude uses to run code (vm_bundles) is never touched."
      before: "Quit Claude."
