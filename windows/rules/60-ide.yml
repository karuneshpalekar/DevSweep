# Editors and IDEs.
rules:
  - id: jetbrains-old
    title: "{{key}} {{version}} settings and caches"
    category: ideVersions
    risk: oldVersion
    minSizeMB: 10
    detector:
      kind: versionedSiblings
      # Settings in AppData\Roaming, caches and logs in AppData\Local.
      parents: ['{RoamingAppData}\JetBrains', '{LocalAppData}\JetBrains']
      pattern: "^(?<key>[A-Za-z]+)(?<version>20[0-9]{2}\\.[0-9]+)$"
      keep: 1
      groupEach: true
      # A version still installed side by side (Toolbox, or two installers) keeps its folders.
      installedAs:
        - { key: IntelliJIdea, names: ["IntelliJ IDEA"] }
        - { key: IdeaIC, names: ["IntelliJ IDEA Community"] }
        - { key: PyCharm, names: ["PyCharm"] }
        - { key: PyCharmCE, names: ["PyCharm Community"] }
        - { key: WebStorm, names: ["WebStorm"] }
        - { key: Rider, names: ["JetBrains Rider", "Rider"] }
        - { key: CLion, names: ["CLion"] }
        - { key: GoLand, names: ["GoLand"] }
        - { key: PhpStorm, names: ["PhpStorm"] }
        - { key: RubyMine, names: ["RubyMine"] }
        - { key: DataGrip, names: ["DataGrip"] }
        - { key: RustRover, names: ["RustRover"] }
        - { key: DataSpell, names: ["DataSpell"] }
    actions:
      - kind: trash
    explain:
      what: "Settings, indexes and logs from {{key}} {{version}}."
      why: "{{size}}. {{key}} {{newest}} is newer and imported your settings on first launch."
      ifDeleted: "Nothing changes in {{key}} {{newest}}. If you still open {{key}} {{version}}, it starts with default settings."
      wontLose: "Your projects."
      undo: "Restore the folders from the Recycle Bin (History)."
